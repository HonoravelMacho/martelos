<?xml version="1.0" encoding="UTF-8"?>
<!-- Ícone oficial dos arquivos .martelos: dois martelos cruzados -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="aco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e6ec"/>
      <stop offset="1" stop-color="#8a9099"/>
    </linearGradient>
    <linearGradient id="madeira" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b57e42"/>
      <stop offset="1" stop-color="#6b421e"/>
    </linearGradient>
    <g id="martelo">
      <rect x="29" y="18" width="6" height="38" rx="3" fill="url(#madeira)" stroke="#40260f" stroke-width="1.5"/>
      <rect x="19" y="5" width="26" height="14" rx="2" fill="url(#aco)" stroke="#43484f" stroke-width="1.5"/>
      <rect x="19" y="5" width="6" height="14" fill="#5b6068"/>
      <rect x="42" y="8" width="4" height="8" fill="#5b6068"/>
